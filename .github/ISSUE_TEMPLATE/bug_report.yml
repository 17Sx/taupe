name: 🐛 Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Ce que tu as fait, ce que tu attendais, ce qui s'est passé.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version de Taupe
      placeholder: "1.0.0"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Système
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Messages d'erreur / captures
      description: Ne colle jamais d'informations personnelles (chemins privés, e-mails…).
