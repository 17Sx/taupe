name: 🐛 Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Taupe version
      placeholder: "1.0.0"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Error messages / screenshots
      description: Never paste personal information (private paths, email addresses…).
