name: Release

# Push a vX.Y.Z tag (e.g. git tag v1.3.0 && git push origin v1.3.0) to build the macOS + Windows
# installers and publish them on the public releases repository (17Sx/taupe-releases), where the
# download links and the in-app updates point. A copy of the release is also created here.
#
# Signing and notarization turn on by themselves once their secrets exist (docs/signing.md);
# without them the build is ad-hoc signed (macOS) / unsigned (Windows) and the release notes say so.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# No rights by default: building only reads the code, only the last job can write the release.
# Third-party actions are pinned by commit SHA (Dependabot keeps them up to date).
permissions: {}

env:
  RELEASES_REPO: 17Sx/taupe-releases

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json   # "packageManager" field
      # electron-builder itself runs on Node (it hangs on Bun while building the icons):
      # `bun run` starts it through its `#!/usr/bin/env node` shebang.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check

      # macOS: Developer ID certificate (CSC_LINK = base64 .p12) and App Store Connect API key for
      # notarization. Missing secrets → empty variables → ad-hoc build (see electron-builder.js).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_CONTENT
          bun run dist -- --mac
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/Taupe.app; do
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature)=' || true
            spctl -a -vv -t exec "$app" || echo "::warning::$app is not accepted by Gatekeeper (not notarized)"
          done

      # Windows: Azure Artifact Signing (preferred) or a .pfx certificate. Missing secrets → unsigned.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAUPE_AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          TAUPE_AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          TAUPE_AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          TAUPE_AZURE_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          bun run dist -- --win

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taupe-${{ matrix.name }}
          if-no-files-found: error
          # latest*.yml + .blockmap: read by the in-app updater
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes (CHANGELOG.md + install instructions)
        env:
          MAC_NOTARIZED: ${{ secrets.MAC_CERTIFICATE != '' && secrets.APPLE_API_KEY != '' }}
          WIN_SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' || secrets.WIN_CERTIFICATE != '' }}
        run: bun scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md && cat notes.md
      # Public releases repository: needs RELEASES_TOKEN, a fine-grained token with
      # "Contents: read and write" on 17Sx/taupe-releases only (docs/signing.md).
      - name: Publish on the public releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASES_TOKEN secret is missing: the installers cannot be published on $RELEASES_REPO (see docs/signing.md)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$RELEASES_REPO" \
            --title "Taupe ${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Copy the release on this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Taupe ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
