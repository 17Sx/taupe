name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# No rights by default; each job asks only for what it needs.
# Third-party actions are pinned by commit SHA (Dependabot keeps them up to date).
permissions: {}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check   # syntax, ESLint, tsc --checkJs
      - run: npm test
