name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# No rights by default; each job asks only for what it needs.
# Third-party actions are pinned by commit SHA (Dependabot keeps them up to date).
permissions: {}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json   # "packageManager" field
      - run: bun install --frozen-lockfile
      - run: bun run check   # ESLint (incl. syntax), tsc --checkJs
      - run: bun run test
