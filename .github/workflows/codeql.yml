name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # every Monday
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      # The repository is private and GitHub code scanning is not enabled on it (it needs GitHub Code
      # Security, or a public repository), so results cannot be uploaded: the job fails on any alert
      # instead, and the SARIF report is attached to the run. Once code scanning is enabled, switch to
      # `upload: always` (and `security-events: write`) to get the alerts in the Security tab.
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
          upload: never
          output: sarif
      # Reviewed false positives (rule + file, with the reason) live in .github/codeql-accepted.json
      - name: Fail on CodeQL alerts
        run: |
          filter='[.runs[].results[] | . as $r | select(($accepted[0] | map(select(.rule == $r.ruleId and .file == $r.locations[0].physicalLocation.artifactLocation.uri)) | length) == 0)]'
          jq -r --slurpfile accepted .github/codeql-accepted.json "$filter"' | .[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text | split("\n")[0])"' sarif/*.sarif
          count=$(jq --slurpfile accepted .github/codeql-accepted.json "$filter | length" sarif/*.sarif | paste -sd+ - | bc)
          echo "CodeQL alerts (not accepted): $count"
          test "$count" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif/
